<?xml version="1.0" encoding="UTF-8"?>
<!--
  Alpha IOI - temporary application icon

  This is a PLACEHOLDER. The official logo will be based on the "A7" mark; this
  file only exists so the application has a window/dock icon in the meantime.

  To replace it with the final logo, overwrite THIS FILE (keep the filename
  `alpha-ioi.svg` and the square viewBox) and re-run:

      scripts/build-icons.sh    (regenerates the rasterized PNG copies)

  See the "Replacing the logo" section of README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-label="Alpha IOI temporary A7 mark">
  <defs>
    <linearGradient id="alpha-ioi-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2A40"/>
      <stop offset="1" stop-color="#15151F"/>
    </linearGradient>
  </defs>

  <!-- Square canvas -->
  <rect width="512" height="512" rx="112" fill="url(#alpha-ioi-bg)"/>
  <rect x="22" y="22" width="468" height="468" rx="96"
        fill="none" stroke="#8BE9FD" stroke-opacity="0.30" stroke-width="4"/>

  <!-- Temporary "A7" wordmark -->
  <text x="256" y="350"
        font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"
        font-size="236" font-weight="bold" fill="#F5F5FA"
        text-anchor="middle">A7</text>
</svg>
